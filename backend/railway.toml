# Backend API service (set Root Directory to /backend in Railway)
[build]
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# NOTE: Do NOT use `prisma db push` as preDeploy on Railway.
# It fails when unmanaged runtime tables exist (AI embeddings) and blocks deploys.
# Core schema is already applied from prior deploys; AI tables are created at
# runtime via ensureSemanticTables(). For one-off schema sync use Railway Console:
#   npx prisma db push
