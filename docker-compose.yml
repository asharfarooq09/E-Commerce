services:
  postgres:
    image: postgres:16-alpine
    container_name: shopai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopai
    volumes:
      - shopai_pg_data:/var/lib/postgresql/data

volumes:
  shopai_pg_data:
