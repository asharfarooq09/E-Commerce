services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopai
    volumes:
      - shopai_pg_data:/var/lib/postgresql/data
      - ./backend/scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro

volumes:
  shopai_pg_data:
